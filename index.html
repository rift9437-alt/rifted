<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riftted Realities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05050a;
      --bg2: #0c0c14;
      --card: #11111b;
      --elevated: #161622;
      --hover: #1c1c2a;
      --purple: #a855f7;
      --purple-dim: #7c3aed;
      --blue: #22d3ee;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --muted: #64748b;
      --border: #1e1e2e;
      --radius: 12px;
      --nav-h: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    img { max-width: 100%; display: block; }

    /* ===== NAV ===== */
    .nav {
      position: sticky; top: 0; z-index: 100;
      height: var(--nav-h);
      background: rgba(5,5,10,0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
    }
    .nav-inner {
      width: 100%; max-width: 1280px; margin: 0 auto;
      padding: 0 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .logo {
      display: flex; align-items: center; gap: 0.6rem;
      font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
    }
    .logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px rgba(168,85,247,0.35);
    }
    .nav-links { display: flex; gap: 0.25rem; }
    .nav-link {
      padding: 0.5rem 0.9rem; font-size: 0.9rem; font-weight: 500;
      color: var(--text2); border-radius: 6px; transition: 0.15s;
    }
    .nav-link:hover { color: var(--text); background: var(--hover); }
    .nav-link.active { color: var(--text); background: rgba(168,85,247,0.12); }
    .nav-actions { display: flex; align-items: center; gap: 0.5rem; }
    .search-wrap { position: relative; }
    .search-wrap input {
      width: 180px; padding: 0.5rem 0.9rem 0.5rem 2.1rem;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 999px; color: var(--text); font-size: 0.875rem;
      transition: 0.25s;
    }
    .search-wrap input:focus {
      outline: none; border-color: var(--purple); width: 240px;
      box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
    }
    .search-wrap span {
      position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 0.85rem; pointer-events: none;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.65rem 1.3rem; font-size: 0.9rem; font-weight: 500;
      border-radius: 8px; transition: 0.2s; white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--purple), var(--purple-dim));
      color: white; box-shadow: 0 0 18px rgba(168,85,247,0.3);
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-secondary {
      background: transparent; color: var(--text); border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--blue); color: var(--blue); }
    .btn-ghost { color: var(--text2); padding: 0.45rem 0.85rem; }
    .btn-ghost:hover { color: var(--text); background: var(--hover); }
    .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.85rem; }
    .btn-lg { padding: 0.85rem 1.7rem; font-size: 1rem; }
    .menu-btn {
      display: none; width: 40px; height: 40px;
      align-items: center; justify-content: center;
      background: var(--bg2); border-radius: 6px; color: var(--text);
    }

    /* Mobile nav */
    .mobile-nav {
      display: none; position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0;
      background: var(--bg); z-index: 99; padding: 1.5rem; flex-direction: column; gap: 0.4rem;
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav .nav-link { padding: 0.9rem 1rem; font-size: 1.05rem; border-radius: 8px; }

    /* ===== LAYOUT ===== */
    .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
    .section { padding: 2.5rem 0; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem; gap: 1rem;
    }
    .section-title { font-size: 1.4rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }

    /* ===== HERO ===== */
    .hero {
      position: relative; height: clamp(360px, 52vh, 500px);
      border-radius: 20px; overflow: hidden; margin-top: 1.75rem;
      background: var(--bg2); border: 1px solid var(--border);
    }
    .hero-bg {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #0a0a18 0%, #1a0a2e 50%, #0a1520 100%);
    }
    .hero-bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(5,5,10,0.9) 0%, rgba(5,5,10,0.55) 45%, rgba(5,5,10,0.3) 100%);
    }
    .hero-content {
      position: relative; z-index: 2; height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 2.5rem; max-width: 580px;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.25rem 0.7rem; margin-bottom: 0.9rem; width: fit-content;
      background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.35);
      border-radius: 999px; font-size: 0.72rem; font-weight: 600;
      color: var(--purple); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .hero-title { font-size: clamp(1.7rem, 3.8vw, 2.6rem); font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .hero-desc { color: var(--text2); font-size: 1.02rem; margin-bottom: 1.5rem; line-height: 1.55; max-width: 460px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 0.85rem; }

    /* ===== GAME CARDS ===== */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.4rem;
    }
    .scroll-row {
      display: flex; gap: 1.3rem; overflow-x: auto; padding-bottom: 0.75rem;
      scroll-snap-type: x mandatory;
    }
    .scroll-row .game-card { min-width: 250px; max-width: 270px; flex-shrink: 0; scroll-snap-align: start; }
    .game-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; transition: 0.25s; cursor: pointer; display: flex; flex-direction: column; height: 100%;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(168,85,247,0.4);
      box-shadow: 0 12px 32px rgba(0,0,0,0.45), 0 0 24px rgba(168,85,247,0.12);
    }
    .game-thumb {
      position: relative; aspect-ratio: 16/9; overflow: hidden; background: var(--bg2);
    }
    .game-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .game-card:hover .game-thumb img { transform: scale(1.06); }
    .badges { position: absolute; top: 0.55rem; left: 0.55rem; display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .badge {
      padding: 0.18rem 0.5rem; font-size: 0.68rem; font-weight: 600;
      border-radius: 5px; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .badge-new { background: var(--blue); color: #0a0a12; }
    .badge-featured { background: var(--purple); color: white; }
    .badge-demo { background: rgba(255,255,255,0.12); color: var(--text2); }
    .game-body { padding: 0.95rem; display: flex; flex-direction: column; flex: 1; gap: 0.3rem; }
    .game-genre { font-size: 0.72rem; color: var(--blue); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .game-title { font-size: 1.02rem; font-weight: 600; }
    .game-desc {
      font-size: 0.84rem; color: var(--text2); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1;
    }
    .game-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 0.5rem; padding-top: 0.55rem; border-top: 1px solid var(--border);
    }
    .game-date { font-size: 0.72rem; color: var(--muted); }
    .game-play {
      padding: 0.3rem 0.7rem; font-size: 0.78rem; font-weight: 500;
      background: rgba(168,85,247,0.12); color: var(--purple); border-radius: 5px; transition: 0.15s;
    }
    .game-card:hover .game-play { background: var(--purple); color: white; }

    /* Categories */
    .cat-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.9rem;
    }
    .cat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1.3rem 0.8rem; text-align: center; cursor: pointer; transition: 0.2s;
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    }
    .cat-card:hover { border-color: var(--purple); background: rgba(168,85,247,0.08); transform: translateY(-2px); }
    .cat-icon { font-size: 1.6rem; }
    .cat-name { font-size: 0.88rem; font-weight: 500; }

    /* Empty / placeholder */
    .empty {
      text-align: center; padding: 3rem 1.5rem; color: var(--text2);
    }
    .empty .icon { font-size: 2.8rem; margin-bottom: 0.8rem; opacity: 0.55; }
    .empty h3 { color: var(--text); margin-bottom: 0.35rem; }

    .page-placeholder {
      min-height: calc(100vh - var(--nav-h) - 100px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 3rem 1.5rem;
    }
    .page-placeholder .icon { font-size: 3.2rem; margin-bottom: 1rem; opacity: 0.5; }
    .page-placeholder p { color: var(--text2); max-width: 400px; margin: 0.6rem 0 1.5rem; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; opacity: 0; visibility: hidden; transition: 0.25s;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 18px;
      max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55); transform: translateY(16px); transition: 0.25s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-banner { width: 100%; aspect-ratio: 21/9; object-fit: cover; background: var(--card); }
    .modal-body { padding: 1.6rem; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.8rem; }
    .modal-close {
      width: 34px; height: 34px; border-radius: 50%; background: var(--elevated);
      color: var(--text2); display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
    }
    .modal-close:hover { background: var(--hover); color: var(--text); }
    .modal-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; font-size: 0.82rem; color: var(--text2); }
    .modal-meta span { padding: 0.2rem 0.55rem; background: var(--elevated); border-radius: 5px; }
    .modal-actions { display: flex; gap: 0.8rem; margin-top: 1.4rem; }

    /* Footer */
    .footer {
      border-top: 1px solid var(--border); padding: 2rem 0; margin-top: 2.5rem;
      text-align: center; color: var(--muted); font-size: 0.85rem;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1c1c2a; color: var(--text); padding: 0.7rem 1.3rem; border-radius: 10px;
      border: 1px solid #2a2a3a; font-size: 0.88rem; z-index: 500; transition: 0.3s;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Loading */
    .loading {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
      transition: 0.4s;
    }
    .loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .spinner {
      width: 34px; height: 34px; border: 3px solid var(--border);
      border-top-color: var(--purple); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 900px) {
      .nav-links { display: none; }
      .menu-btn { display: flex; }
      .search-wrap input { width: 140px; }
      .search-wrap input:focus { width: 170px; }
    }
    @media (max-width: 640px) {
      .search-wrap { display: none; }
      .hero { height: clamp(300px, 48vh, 400px); border-radius: 14px; }
      .hero-content { padding: 1.4rem; }
      .game-grid { grid-template-columns: 1fr 1fr; gap: 0.8rem; }
      .scroll-row .game-card { min-width: 210px; max-width: 230px; }
      .section-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="color:var(--text2);font-size:0.9rem">Loading Riftted Realities…</p>
  </div>

  <!-- NAV -->
  <header class="nav">
    <div class="nav-inner">
      <a href="/" class="logo" data-page="home">
        <div class="logo-mark">R</div>
        <span>Riftted Realities</span>
      </a>

      <nav class="nav-links">
        <a href="/" class="nav-link active" data-page="home">Home</a>
        <a href="/discover" class="nav-link" data-page="discover">Discover</a>
        <a href="/library" class="nav-link" data-page="library">My Library</a>
        <a href="/recent" class="nav-link" data-page="recent">Recently Played</a>
        <a href="/profile" class="nav-link" data-page="profile">Profile</a>
        <a href="/settings" class="nav-link" data-page="settings">Settings</a>
      </nav>

      <div class="nav-actions">
        <div class="search-wrap">
          <span>🔍</span>
          <input type="search" id="search" placeholder="Search games…" />
        </div>
        <button class="btn btn-ghost btn-sm" onclick="toast('Accounts coming soon')">Log in</button>
        <button class="btn btn-primary btn-sm" onclick="toast('Accounts coming soon')">Sign up</button>
        <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <a href="/" class="nav-link" data-page="home">Home</a>
    <a href="/discover" class="nav-link" data-page="discover">Discover</a>
    <a href="/library" class="nav-link" data-page="library">My Library</a>
    <a href="/recent" class="nav-link" data-page="recent">Recently Played</a>
    <a href="/profile" class="nav-link" data-page="profile">Profile</a>
    <a href="/settings" class="nav-link" data-page="settings">Settings</a>
  </div>

  <main id="app"></main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <img id="mBanner" class="modal-banner" src="" alt="" />
      <div class="modal-body">
        <div class="modal-header">
          <div>
            <h2 id="mTitle"></h2>
            <div class="modal-meta" id="mMeta"></div>
          </div>
          <button class="modal-close" id="mClose">×</button>
        </div>
        <p id="mDesc" style="color:var(--text2)"></p>
        <div class="modal-actions">
          <button class="btn btn-primary btn-lg" id="mPlay">▶ Play Now</button>
          <button class="btn btn-secondary" id="mClose2">Close</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>© 2025 Riftted Realities · Step 1 foundation · Demo build</p>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

        desc: 'Rift Racer showcases the racing genre. Currently a demonstration entry.',
        thumb: 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225"><rect width="400" height="225" fill="#0a0a12"/><text x="200" y="185" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">RIFT RACER</text><text x="200" y="205" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">DEMO</text></svg>`),
        banner: 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500"><rect width="1200" height="500" fill="#0a0a18"/><text x="600" y="260" text-anchor="middle" fill="#f1f5f9" font-family="system-ui" font-size="42" font-weight="700">RIFT RACER</text><text x="600" y="300" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="16">DEMONSTRATION TITLE</text></svg>`),
        genre: 'Racing', date: '2025-08-10', version: '0.1.0-demo', featured: false, isNew: false, isDemo: true
      },
      {
        id: 'demo-survival-node',
        title: 'Survival Node',
        short: 'Build, craft and survive the night in this atmospheric survival demo.',
        desc: 'Survival Node is a placeholder for the survival genre. Full systems coming later.',
        thumb: 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225"><rect width="400" height="225" fill="#0c0c14"/><text x="200" y="185" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">SURVIVAL NODE</text><text x="200" y="205" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">DEMO</text></svg>`),
        banner: 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500"><rect width="1200" height="500" fill="#0a0a18"/><text x="600" y="260" text-anchor="middle" fill="#f1f5f9" font-family="system-ui" font-size="42" font-weight="700">SURVIVAL NODE</text><text x="600" y="300" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="16">DEMONSTRATION TITLE</text></svg>`),
        genre: 'Survival', date: '2025-07-05', version: '0.1.0-demo', featured: false, isNew: false, isDemo: true
      },
      {
        id: 'demo-cityscape',
        title: 'Cityscape Sim',
        short: 'Grow a neon metropolis in this relaxed simulation demo.',
        desc: 'A light simulation demonstration. Placeholder content.',
        thumb: 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225"><rect width="400" height="225" fill="#0a0a12"/><text x="200" y="185" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="16" font-weight="600">CITYSCAPE SIM</text><text x="200" y="205" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">DEMO</text></svg>`),
        banner: 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500"><rect width="1200" height="500" fill="#0a0a18"/><text x="600" y="260" text-anchor="middle" fill="#f1f5f9" font-family="system-ui" font-size="42" font-weight="700">CITYSCAPE SIM</text><text x="600" y="300" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="16">DEMONSTRATION TITLE</text></svg>`),
        genre: 'Simulation', date: '2025-06-12', version: '0.1.0-demo', featured: false, isNew: false, isDemo: true
      }
    ];

    const CATS = [
      { id: 'action', name: 'Action', icon: '⚔️' },
      { id: 'adventure', name: 'Adventure', icon: '🗺️' },
      { id: 'shooter', name: 'Shooter', icon: '🎯' },
      { id: 'survival', name: 'Survival', icon: '🏕️' },
      { id: 'strategy', name: 'Strategy', icon: '♟️' },
      { id: 'simulation', name: 'Simulation', icon: '🏗️' },
      { id: 'racing', name: 'Racing', icon: '🏎️' },
      { id: 'other', name: 'Other', icon: '🎮' }
    ];

    // ========== HELPERS ==========
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function formatDate(iso) {
      try { return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); }
      catch { return iso; }
    }

    function cardHTML(g) {
      const badges = [];
      if (g.isNew) badges.push('<span class="badge badge-new">New</span>');
      if (g.featured) badges.push('<span class="badge badge-featured">Featured</span>');
      if (g.isDemo) badges.push('<span class="badge badge-demo">Demo</span>');
      return `
        <article class="game-card" data-id="${g.id}">
          <div class="game-thumb">
            <img src="${g.thumb}" alt="${g.title}" loading="lazy" />
            <div class="badges">${badges.join('')}</div>
          </div>
          <div class="game-body">
            <div class="game-genre">${g.genre}</div>
            <h3 class="game-title">${g.title}</h3>
            <p class="game-desc">${g.short}</p>
            <div class="game-footer">
              <span class="game-date">${formatDate(g.date)}</span>
              <span class="game-play">Play</span>
            </div>
          </div>
        </article>`;
    }

    function openModal(g) {
      document.getElementById('mBanner').src = g.banner;
      document.getElementById('mTitle').textContent = g.title;
      document.getElementById('mDesc').textContent = g.desc;
      document.getElementById('mMeta').innerHTML = `
        <span>${g.genre}</span>
        <span>${formatDate(g.date)}</span>
        <span>v${g.version}</span>
        ${g.isDemo ? '<span>Demo</span>' : ''}`;
      document.getElementById('mPlay').onclick = () => toast(`Launching "${g.title}" — full player coming soon`);
      document.getElementById('modal').classList.add('open');
    }

    // ========== PAGES ==========
    function renderHome() {
      const featured = GAMES.filter(g => g.featured);
      const hero = featured[0] || GAMES[0];
      const recent = [...GAMES].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 6);

      return `
        <div class="container">
          <section class="hero">
            <div class="hero-bg"></div>
            <div class="hero-content">
              <div class="hero-badge">★ Featured Demo</div>
              <h1 class="hero-title">${hero.title}</h1>
              <p class="hero-desc">${hero.short}</p>
              <div class="hero-actions">
                <button class="btn btn-primary btn-lg" onclick='openModal(${JSON.stringify(hero).replace(/'/g,"&#39;")})'>▶ Play Now</button>
                <button class="btn btn-secondary btn-lg" onclick='openModal(${JSON.stringify(hero).replace(/'/g,"&#39;")})'>Explore</button>
              </div>
            </div>
          </section>

          <section class="section">
            <div class="section-header">
              <h2 class="section-title">✨ Recently Added</h2>
              <a href="/discover" class="btn btn-ghost" data-page="discover">View all →</a>
            </div>
            <div class="scroll-row">${recent.map(cardHTML).join('')}</div>
          </section>

          <section class="section">
            <div class="section-header">
              <h2 class="section-title">🔥 Popular Games</h2>
            </div>
            <div class="game-grid">${GAMES.map(cardHTML).join('')}</div>
          </section>

          <section class="section">
            <div class="section-header">
              <h2 class="section-title">📂 Browse Categories</h2>
            </div>
            <div class="cat-grid">
              ${CATS.map(c => `
                <div class="cat-card" data-genre="${c.name}">
                  <div class="cat-icon">${c.icon}</div>
                  <div class="cat-name">${c.name}</div>
                </div>`).join('')}
            </div>
          </section>

          <section class="section">
            <div class="section-header">
              <h2 class="section-title">▶️ Continue Playing</h2>
            </div>
            <div class="empty">
              <div class="icon">🕹️</div>
              <h3>No games in progress</h3>
              <p>Once you start playing, your progress will appear here.</p>
            </div>
          </section>

          <section class="section" style="text-align:center;padding-bottom:3rem">
            <h2 style="margin-bottom:0.6rem">Ready to explore?</h2>
            <p style="color:var(--text2);margin-bottom:1.3rem">Browse the full demonstration library.</p>
            <a href="/discover" class="btn btn-primary btn-lg" data-page="discover">Explore All Games</a>
          </section>
        </div>`;
    }

    function renderDiscover(filterGenre = null, searchQ = '') {
      let list = [...GAMES];
      if (filterGenre && filterGenre !== 'All') {
        list = list.filter(g => g.genre.toLowerCase() === filterGenre.toLowerCase());
      }
      if (searchQ) {
        const q = searchQ.toLowerCase();
        list = list.filter(g => g.title.toLowerCase().includes(q) || g.short.toLowerCase().includes(q) || g.genre.toLowerCase().includes(q));
      }

      const genres = ['All', 'Action', 'Adventure', 'Strategy', 'Racing', 'Survival', 'Simulation'];
      return `
        <div class="container">
          <section class="section">
            <div class="section-header">
              <h2 class="section-title">🔍 Discover Games</h2>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:0.45rem;margin-bottom:1.4rem" id="genreFilters">
              ${genres.map(g => `
                <button class="btn btn-sm ${(!filterGenre && g==='All') || filterGenre===g ? 'btn-primary' : 'btn-secondary'}" data-genre="${g}">${g}</button>
              `).join('')}
            </div>
            <div class="game-grid" id="discoverGrid">
              ${list.length ? list.map(cardHTML).join('') : `
                <div class="empty" style="grid-column:1/-1">
                  <div class="icon">🎮</div>
                  <h3>No games found</h3>
                  <p>Try a different search or category.</p>
                </div>`}
            </div>
          </section>
        </div>`;
    }

    function renderPlaceholder(page) {
      const meta = {
        library: { icon: '📚', title: 'My Library', text: 'Your personal game collection will live here once accounts are available.' },
        recent: { icon: '🕐', title: 'Recently Played', text: 'Games you have launched recently will appear here after play-tracking is built.' },
        profile: { icon: '👤', title: 'Profile', text: 'Player profiles, avatars and customisation are planned for a future update.' },
        settings: { icon: '⚙️', title: 'Settings', text: 'Account and platform settings will be available after authentication is implemented.' }
      };
      const m = meta[page] || { icon: '🚧', title: 'Coming Soon', text: 'This section is under construction.' };
      return `
        <div class="page-placeholder">
          <div class="icon">${m.icon}</div>
          <h1>${m.title}</h1>
          <p>${m.text}</p>
          <a href="/" class="btn btn-primary" data-page="home">Back to Home</a>
        </div>`;
    }

    // ========== ROUTER ==========
    let currentPage = 'home';

    function navigate(page, push = true) {
      currentPage = page;
      document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.page === page));
      const app = document.getElementById('app');

      if (page === 'home') app.innerHTML = renderHome();
      else if (page === 'discover') app.innerHTML = renderDiscover();
      else app.innerHTML = renderPlaceholder(page);

      // Bind card clicks
      app.querySelectorAll('.game-card').forEach(c => {
        c.addEventListener('click', () => {
          const g = GAMES.find(x => x.id === c.dataset.id);
          if (g) openModal(g);
        });
      });

      // Category clicks
      app.querySelectorAll('.cat-card').forEach(c => {
        c.addEventListener('click', () => {
          history.pushState({ page: 'discover' }, '', '/discover');
          navigate('discover');
          setTimeout(() => {
            const genre = c.dataset.genre;
            app.innerHTML = renderDiscover(genre);
            bindDiscover();
          }, 10);
        });
      });

      if (page === 'discover') bindDiscover();

      if (push) {
        const path = page === 'home' ? '/' : '/' + page;
        history.pushState({ page }, '', path);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function bindDiscover() {
      document.querySelectorAll('#genreFilters button').forEach(btn => {
        btn.addEventListener('click', () => {
          const genre = btn.dataset.genre;
          document.getElementById('app').innerHTML = renderDiscover(genre === 'All' ? null : genre);
          bindDiscover();
          document.querySelectorAll('.game-card').forEach(c => {
            c.addEventListener('click', () => {
              const g = GAMES.find(x => x.id === c.dataset.id);
              if (g) openModal(g);
            });
          });
        });
      });
    }

    // ========== INIT ==========
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => document.getElementById('loading').classList.add('hidden'), 500);

      // Menu
      document.getElementById('menuBtn').addEventListener('click', () => {
        document.getElementById('mobileNav').classList.toggle('open');
      });

      // Nav clicks
      document.addEventListener('click', e => {
        const link = e.target.closest('[data-page]');
        if (link) {
          e.preventDefault();
          document.getElementById('mobileNav').classList.remove('open');
          navigate(link.dataset.page);
        }
      });

      // Search
      let searchTimer;
      document.getElementById('search').addEventListener('input', e => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          const q = e.target.value.trim();
          if (currentPage !== 'discover') {
            history.pushState({ page: 'discover' }, '', '/discover');
            navigate('discover', false);
          }
          document.getElementById('app').innerHTML = renderDiscover(null, q);
          bindDiscover();
          document.querySelectorAll('.game-card').forEach(c => {
            c.addEventListener('click', () => {
              const g = GAMES.find(x => x.id === c.dataset.id);
              if (g) openModal(g);
            });
          });
        }, 200);
      });

      // Modal close
      document.getElementById('mClose').onclick = () => document.getElementById('modal').classList.remove('open');
      document.getElementById('mClose2').onclick = () => document.getElementById('modal').classList.remove('open');
      document.getElementById('modal').addEventListener('click', e => {
        if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') document.getElementById('modal').classList.remove('open');
      });

      // Initial route
      const path = location.pathname.replace(/\/$/, '') || '/';
      const map = { '/': 'home', '/discover': 'discover', '/library': 'library', '/recent': 'recent', '/profile': 'profile', '/settings': 'settings' };
      navigate(map[path] || 'home', false);

      window.addEventListener('popstate', e => {
        navigate((e.state && e.state.page) || 'home', false);
      });
    });
  </script>
</body>
</html>
