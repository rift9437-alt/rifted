<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Starfall</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02040a;font-family:system-ui,sans-serif;color:#e8eef8}
canvas{display:block;position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#score{position:absolute;top:16px;left:20px;font-size:14px;color:#9ad4ff}
#hpbar{position:absolute;top:16px;right:20px;width:140px;height:10px;background:#1a1a2e;border-radius:5px;overflow:hidden;border:1px solid #334}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#a855f7);transition:width .2s}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:22px;font-weight:700;text-shadow:0 0 20px #22d3ee;display:none}
#pause{position:fixed;inset:0;background:rgba(2,4,10,.85);display:none;align-items:center;justify-content:center;z-index:10;flex-direction:column;gap:12px}
#pause h2{font-size:28px;letter-spacing:4px;color:#22d3ee}
#pause button{pointer-events:auto;padding:10px 24px;background:#22d3ee;color:#02040a;border:none;border-radius:8px;font-weight:700;cursor:pointer}
#start{position:fixed;inset:0;background:radial-gradient(ellipse,#0a1020, #02040a);display:flex;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:10px;cursor:pointer}
#start h1{font-size:36px;letter-spacing:6px;color:#22d3ee;text-shadow:0 0 30px rgba(34,211,238,.5)}
#start p{color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="score">SCORE: 0 · WAVE 1</div>
  <div id="hpbar"><div id="hpfill"></div></div>
  <div id="msg"></div>
</div>
<div id="pause"><h2>PAUSED</h2><p style="color:#94a3b8">ESC / P to resume</p><button id="resumeBtn">Resume</button><button id="restartBtn">Restart</button></div>
<div id="start"><h1>STARFALL</h1><p>WASD / Arrows move · SPACE / Click fire · ESC pause</p><p style="margin-top:16px;color:#22d3ee">Click to start</p></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,running=false,paused=false,score=0,wave=1,hp=100,t=0;
const keys={};
const player={x:0,y:0,vx:0,vy:0,r:14,angle:0,cooldown:0};
const bullets=[],enemies=[],particles=[],stars=[];

function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;player.x=W/2;player.y=H/2;}
addEventListener('resize',resize);resize();

addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Escape'||e.code==='KeyP')togglePause();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousedown',()=>{if(running&&!paused)fire();});
document.getElementById('start').onclick=()=>{document.getElementById('start').style.display='none';running=true;reset();};
document.getElementById('resumeBtn').onclick=()=>togglePause();
document.getElementById('restartBtn').onclick=()=>{togglePause();reset();};

function togglePause(){if(!running)return;paused=!paused;document.getElementById('pause').style.display=paused?'flex':'none';}
function reset(){score=0;wave=1;hp=100;t=0;bullets.length=0;enemies.length=0;particles.length=0;player.x=W/2;player.y=H/2;player.vx=0;player.vy=0;spawnWave();updateHUD();}
function updateHUD(){document.getElementById('score').textContent=`SCORE: ${score} · WAVE ${wave}`;document.getElementById('hpfill').style.width=hp+'%';}

for(let i=0;i<120;i++)stars.push({x:Math.random()*2000,y:Math.random()*2000,z:Math.random()*3+0.5,s:Math.random()*1.5+0.3});

function fire(){if(player.cooldown>0)return;player.cooldown=0.18;
  const a=player.angle;bullets.push({x:player.x+Math.cos(a)*18,y:player.y+Math.sin(a)*18,vx:Math.cos(a)*520,vy:Math.sin(a)*520,life:1.2});}

function spawnWave(){
  const n=4+wave*2;
  for(let i=0;i<n;i++){
    const side=Math.floor(Math.random()*4);
    let x,y;if(side===0){x=Math.random()*W;y=-30;}else if(side===1){x=W+30;y=Math.random()*H;}else if(side===2){x=Math.random()*W;y=H+30;}else{x=-30;y=Math.random()*H;}
    enemies.push({x,y,vx:0,vy:0,r:12+Math.random()*8,hp:1+Math.floor(wave/2),type:Math.random()>0.7?1:0});
  }
}

function boom(x,y,col){for(let i=0;i<14;i++){const a=Math.random()*6.28,sp=40+Math.random()*120;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.4,col});}}

function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-(loop.t||now))/1000,0.05);loop.t=now;
  if(!running||paused){draw();return;}
  t+=dt;

  // input
  let ax=0,ay=0;
  if(keys['KeyW']||keys['ArrowUp'])ay-=1;
  if(keys['KeyS']||keys['ArrowDown'])ay+=1;
  if(keys['KeyA']||keys['ArrowLeft'])ax-=1;
  if(keys['KeyD']||keys['ArrowRight'])ax+=1;
  if(ax||ay){const l=Math.hypot(ax,ay);ax/=l;ay/=l;player.angle=Math.atan2(ay,ax);}
  if(keys['Space'])fire();
  player.cooldown=Math.max(0,player.cooldown-dt);
  const accel=380;
  player.vx+=(ax*accel-player.vx*3.2)*dt;
  player.vy+=(ay*accel-player.vy*3.2)*dt;
  player.x+=player.vx*dt;player.y+=player.vy*dt;
  player.x=Math.max(20,Math.min(W-20,player.x));
  player.y=Math.max(20,Math.min(H-20,player.y));

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)bullets.splice(i,1);
  }
  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    const spd=e.type?90:60+wave*4;
    e.vx=dx/d*spd;e.vy=dy/d*spd;
    e.x+=e.vx*dt;e.y+=e.vy*dt;
    if(d<e.r+player.r){hp-=12;boom(e.x,e.y,'#ff4466');enemies.splice(i,1);updateHUD();if(hp<=0){hp=0;gameOver();return;}}
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){e.hp--;bullets.splice(j,1);if(e.hp<=0){score+=e.type?25:10;boom(e.x,e.y,e.type?'#a855f7':'#22d3ee');enemies.splice(i,1);updateHUD();}break;}
    }
  }
  if(enemies.length===0){wave++;spawnWave();updateHUD();flash(`WAVE ${wave}`);}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);}
  draw();
}

function flash(txt){const m=document.getElementById('msg');m.textContent=txt;m.style.display='block';setTimeout(()=>m.style.display='none',1200);}
function gameOver(){running=false;flash('GAME OVER — Click to restart');document.getElementById('start').style.display='flex';document.getElementById('start').querySelector('p:last-child').textContent='Click to restart';}

function draw(){
  ctx.fillStyle='#02040a';ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='#8af';
  for(const s of stars){
    const px=((s.x-player.x*0.02*s.z)%W+W)%W,py=((s.y-player.y*0.02*s.z)%H+H)%H;
    ctx.globalAlpha=0.3+s.z*0.2;ctx.beginPath();ctx.arc(px,py,s.s,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  // particles
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.28);ctx.fill();}
  ctx.globalAlpha=1;
  // bullets
  ctx.fillStyle='#7df9ff';ctx.shadowColor='#22d3ee';ctx.shadowBlur=8;
  for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,6.28);ctx.fill();}
  ctx.shadowBlur=0;
  // enemies
  for(const e of enemies){
    ctx.fillStyle=e.type?'#a855f7':'#ff4466';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.28);ctx.fill();
    ctx.strokeStyle='#fff3';ctx.lineWidth=2;ctx.stroke();
  }
  ctx.shadowBlur=0;
  // player ship
  ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);
  ctx.fillStyle='#22d3ee';ctx.shadowColor='#22d3ee';ctx.shadowBlur=16;
  ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,10);ctx.lineTo(-6,0);ctx.lineTo(-10,-10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#a855f7';ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-14,5);ctx.lineTo(-14,-5);ctx.fill();
  ctx.restore();ctx.shadowBlur=0;
}
requestAnimationFrame(loop);
</script>
</body>
</html>
